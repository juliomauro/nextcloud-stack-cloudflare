<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="40" y="40" width="240" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="75" font-size="18" font-weight="700" fill="#1e293b">Browser</text>
  <text x="60" y="100" font-size="13" fill="#64748b">you, from anywhere</text>
  <text x="60" y="120" font-size="12" fill="#64748b" font-family="ui-monospace, monospace">https://cloud.example.com</text>

  <!-- Cloudflare Edge -->
  <rect x="380" y="40" width="300" height="130" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="72" font-size="18" font-weight="700" fill="#9a3412">Cloudflare Edge</text>
  <text x="400" y="96" font-size="13" fill="#9a3412">DNS for cloud.example.com</text>
  <text x="400" y="116" font-size="13" fill="#9a3412">Automatic TLS certificate</text>
  <text x="400" y="136" font-size="13" fill="#9a3412">Bridges the two outbound connections</text>

  <!-- Arrow 1: Browser -> Cloudflare Edge -->
  <line x1="280" y1="100" x2="372" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="283" y="88" font-size="12.5" fill="#475569">1 - normal HTTPS request</text>

  <!-- Arrow 2: Cloudflare Edge -> cloudflared (dashed, orange) -->
  <line x1="530" y1="172" x2="453" y2="378" stroke="#f97316" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-orange)"/>
  <text x="545" y="255" font-size="12.5" fill="#c2410c">2 - outbound tunnel, started by</text>
  <text x="545" y="272" font-size="12.5" fill="#c2410c">cloudflared, always open</text>

  <!-- Home network outer box -->
  <rect x="40" y="280" width="920" height="440" rx="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="60" y="312" font-size="15" font-weight="700" fill="#334155">HOME NETWORK (CGNAT, no public IP)</text>

  <!-- Router / Modem -->
  <rect x="70" y="340" width="180" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="378" font-size="15" font-weight="700" fill="#1e293b">Router / Modem</text>
  <text x="90" y="402" font-size="13" fill="#64748b">0 ports forwarded</text>

  <!-- Docker host inner box -->
  <rect x="290" y="330" width="620" height="360" rx="14" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="358" font-size="14.5" font-weight="700" fill="#334155">DOCKER HOST — docker compose up -d</text>

  <!-- cloudflared -->
  <rect x="320" y="385" width="250" height="130" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="340" y="418" font-size="15.5" font-weight="700" fill="#9a3412">cloudflared</text>
  <text x="340" y="442" font-size="12.5" fill="#9a3412">keeps the tunnel open</text>
  <text x="340" y="462" font-size="12.5" fill="#9a3412">outbound connection 24/7</text>

  <!-- nextcloud -->
  <rect x="630" y="385" width="250" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="650" y="418" font-size="15.5" font-weight="700" fill="#1e293b">nextcloud</text>
  <text x="650" y="442" font-size="12.5" fill="#64748b">Apache + PHP</text>
  <text x="650" y="462" font-size="12.5" fill="#64748b">:80</text>

  <!-- redis -->
  <rect x="320" y="545" width="250" height="130" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="340" y="578" font-size="15.5" font-weight="700" fill="#0f766e">redis</text>
  <text x="340" y="602" font-size="12.5" fill="#0f766e">cache + file locking</text>
  <text x="340" y="622" font-size="12.5" fill="#0f766e">:6379</text>

  <!-- db -->
  <rect x="630" y="545" width="250" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="650" y="578" font-size="15.5" font-weight="700" fill="#1e293b">db (MariaDB)</text>
  <text x="650" y="602" font-size="12.5" fill="#64748b">users, metadata, files</text>
  <text x="650" y="622" font-size="12.5" fill="#64748b">:3306</text>

  <!-- arrow cloudflared -> nextcloud -->
  <line x1="572" y1="450" x2="622" y2="450" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-grey)"/>
  <text x="577" y="438" font-size="11.5" fill="#475569">http :80</text>

  <!-- arrow nextcloud -> db -->
  <line x1="755" y1="517" x2="755" y2="537" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-grey)"/>
  <text x="762" y="533" font-size="11.5" fill="#475569">SQL</text>

  <!-- arrow nextcloud -> redis (elbow) -->
  <polyline points="700,517 700,528 460,528 460,537" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-grey)"/>
  <text x="560" y="522" font-size="11.5" fill="#475569">cache</text>

  <!-- footer note -->
  <text x="60" y="742" font-size="12" fill="#94a3b8">Both the browser and cloudflared only open outbound connections toward Cloudflare — nothing connects inbound into the home network.</text>
</svg>
